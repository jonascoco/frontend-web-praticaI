<!DOCTYPE html>
<html lang="pt-BR">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Organização Mobilidade - Cadastro de Voluntário</title>
    </head>
    <body>
        <!-- Header -->
        <header>
            <img src="./imagens/logo_organizacao_mobilidade_jac_v1.png"  width="5%" height="5%">
            <h1>Organização Mobilidade</h1>
            <nav>
                <ul><li><a href="index.html">Início</a></li></ul>
                <ul><li><a href="projeto.html">Projeto</a></li></ul>
            </nav>
        </header>
        <!-- Section -->
        <section>
            <div>
                <p>Junte-se a nós e faça a diferença na vida de muitas Pessoas
                    através do Voluntariado.</p>
            </div>
        </section>
        <!-- Formulário de Cadastro -->
        <main>
            <section>
                <img src="./imagens/voluntarios_01.png"  width="10%" height="70%">
                <h2>Cadastro de Voluntários</h2>
                <form>
                    <fieldset>
                        <legend>Dados Pessoais</legend>
                        <div>
                            <label for="nome">Nome Completo *</label>
                            <input type="text" id="nome" name="nome" required>
                        </div>
                        <div>
                            <label for="email">E-mail *</label>
                            <input type="email" id="email" name="email"
                                required>
                        </div>
                        <div>
                            <label for="cpf">CPF *</label>
                            <input type="text" id="cpf" name="cpf"
                                placeholder="###.###.###-##" 
                                maxlength="14" required>
                        </div>
                        <div>
                            <label for="telefone">Telefone *</label>
                            <input type="text" id="telefone" name="telefone"
                                placeholder="(##) # ####-####" required>
                        </div>
                        <div>
                            <label for="dtnasc">Data de Nascimento *</label>
                            <input type="date" id="dtnasc" name="dtnasc"
                                required>
                        </div>
                        <div>
                            <label for="endereco">Endereço *</label>
                            <input type="text" id="endereco" name="endereco"
                                min="16" max="100" required>
                        </div>
                        <div>
                            <label for="cep">CEP *</label>
                            <input type="text" id="cep" name="cep" placeholder="#####-###" maxlength="9" required>
                        </div>
                        <div>
                            <label for="cidade">Cidade *</label>
                            <input type="text" id="cidade" name="cidade" min="3"
                                max="40" required>
                        </div>
                        <div>
                            <label for="estado">Estado *</label>
                            <input type="text" id="estado" name="estado"
                                required>
                        </div>
                    </fieldset>
                    <button type="submit">Enviar Cadastro</button>
                </form>
            </section>
        </main>
        <!-- Footer -->
        <footer>
            <p>&copy; 2025 Organização Mobilidade. Todos os direitos reservados.
                (jac)</p>
        </footer>
    </body>
</html>
